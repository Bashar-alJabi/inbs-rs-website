name: Quality checks

on:
  pull_request:
    branches: [redesign, main]
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_INDEXABLE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Temporary one-run asset import. Removed after the image is committed locally.
      - name: Import approved Dubai luxury backdrop
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 45 'https://images.pexels.com/photos/12462486/pexels-photo-12462486.jpeg?auto=compress&cs=tinysrgb&w=1600' --output /tmp/inbs-statement-dubai.jpg
          test "$(wc -c < /tmp/inbs-statement-dubai.jpg)" -gt 10000
          echo 'INBS_ASSET_BASE64_BEGIN'
          base64 /tmp/inbs-statement-dubai.jpg | fold -w 500
          echo 'INBS_ASSET_BASE64_END'
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production smoke checks
        shell: bash
        run: |
          npm run start > /tmp/inbs-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/en > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/inbs-start.log
            exit 1
          fi
          npm run test:smoke
