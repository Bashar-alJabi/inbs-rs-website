name: Quality checks

on:
  pull_request:
    branches: [redesign, main]
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_INDEXABLE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production smoke checks
        shell: bash
        run: |
          npm run start > /tmp/inbs-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/en > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/inbs-start.log
            exit 1
          fi
          npm run test:smoke
